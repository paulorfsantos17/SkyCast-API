services:
  python-producer:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./apps/producer-python:/app
    env_file:
      - ./.env
    depends_on:
      - rabbitmq
    command: >
      sh -c "
        pip install poetry &&
        poetry config virtualenvs.create false &&
        poetry install &&
        poetry run python main.py
      "
  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  worker-go:
    build:
      context: ./apps/worker_go
    container_name: worker_go
    working_dir: /app
    volumes:
      - ./apps/worker_go:/app    # <<< HOT RELOAD
    env_file:
      - ./.env
    depends_on:
      - rabbitmq
      - python-producer
    restart: unless-stopped
  nest-dev:
    image: node:22.16.0-alpine
    container_name: nest-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
    env_file:
      - ./.env
    command:  sh -c "
      npm install -g pnpm @nestjs/cli &&
      pnpm i &&
      pnpm start:dev"
    