version: '3.8'

services:

  python-producer:
    build:
      context: ./apps/producer-python
      dockerfile: dockerfile
    container_name: weather-producer
    working_dir: /app
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-go:
    build:
      context: ./apps/worker_go
      dockerfile: ./Dockerfile.dev
    container_name: worker_go
    working_dir: /app
    volumes:
      - ./apps/worker_go:/app
    env_file:
      - ./.env.development
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      nest-dev:
        condition: service_started
    restart: unless-stopped

  nest-dev:
    build:
      context: ./apps/api
      dockerfile: ./Dockerfile.dev
    container_name: nest-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    env_file:
      - .env.development
    environment:
      - CI=true
      - PNPM_HOME=/app/.pnpm-store
      - REDIS_HOST=redis-nontls   # container_name do redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    command: sh -c "pnpm install --force && pnpm start:dev"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db
    restart: always

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ./Dockerfile.dev
    container_name: frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      nest-dev:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis-nontls
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    user: root
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo_data: