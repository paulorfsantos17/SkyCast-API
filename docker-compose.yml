services:
  python-producer:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./apps/producer-python:/app
    env_file:
      - ./.env
    depends_on:
      - rabbitmq
    command: >
      sh -c "
        pip install poetry &&
        poetry config virtualenvs.create false &&
        poetry install &&
        poetry run python main.py
      "
  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  worker-go:
    image: golang:1.20
    container_name: worker-go
    working_dir: /app
    volumes:
      - ./apps/worker-go:/app
    env_file:
      - ./.env
    depends_on:
      - rabbitmq
    command: go run ./cmd/worker/main.go
    restart: unless-stopped
  